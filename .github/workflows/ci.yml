name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy networkx pytest ruff
      - name: Fast tests (no model downloads)
        run: pytest -q tests/test_hrr.py tests/test_graph.py tests/test_config.py tests/test_evaluate.py
      - name: Lint
        run: ruff check src/ tests/ || true
